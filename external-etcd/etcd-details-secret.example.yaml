# -----------------------------------------------------------------------------
# etcd-details Secret - TEMPLATE ONLY. Never commit real values to Git.
#
# Same name, keys, label and annotation as the working in-cluster Secret.
#   label      include: "true"                     -> picked up by the policy filter
#   annotation kanister.kasten.io/blueprint        -> tells Kasten which blueprint to run
#
# stringData takes plain text; Kubernetes base64-encodes it into .data.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: etcd-details
  namespace: etcd-backup
  labels:
    include: "true"
  annotations:
    kanister.kasten.io/blueprint: etcd-blueprint
type: Opaque
stringData:
  # Used by backup: a single etcd client URL
  endpoints: "https://<ETCD_IP>:2379"
  cacert: |
    -----BEGIN CERTIFICATE-----
    <etcd CA certificate>
    -----END CERTIFICATE-----
  cert: |
    -----BEGIN CERTIFICATE-----
    <etcd client certificate>
    -----END CERTIFICATE-----
  key: |
    -----BEGIN PRIVATE KEY-----
    <etcd client private key>
    -----END PRIVATE KEY-----
  # Used by restore: SSH access to the etcd host (user needs passwordless sudo)
  ssh_host: "<ETCD_IP>"
  ssh_user: "<SSH_USER>"
  sshkey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    <private key for SSH_USER>
    -----END OPENSSH PRIVATE KEY-----
